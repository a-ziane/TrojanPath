<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#990000" />
    <meta
      name="description"
      content="TrojanPath — Turn your goals into your game plan. Personalized career pathways for USC students."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>TrojanPath · Your next chapter</title>
    <script>
      // Apply the saved (or device) theme before first paint to avoid a flash.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("trojanpath:theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        if (t === "dark") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#141111");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
